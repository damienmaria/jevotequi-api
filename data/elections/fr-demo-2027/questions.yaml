# Guideline §11 and §12.
#
# Every question carries its neutrality review. The four tests are:
#   symmetry      — both "agree" and "disagree" are defensible positions
#   vocabulary    — wording from the public debate, not from one side
#   single_issue  — asks exactly one thing
#   answerability — every included candidate could hold a position on it
#
# §12 degraded mode: reviewed by the author at least 24 hours later, then
# opened to public comment before the election opens. `public_review_mr` is
# filled when that merge request exists.

