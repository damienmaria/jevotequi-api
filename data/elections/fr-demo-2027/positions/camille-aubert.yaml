positions:
  - { <<: *d, question_id: eco-1, position: -1, status: confirmed, quote: "Nous refusons une baisse indifférenciée de la dépense publique." }
  - { <<: *d, question_id: eco-2, position: 2, status: confirmed, quote: "Nous créerons une tranche supplémentaire d'impôt sur le revenu." }
  - { <<: *d, question_id: eco-3, position: 0, status: confirmed, quote: "Les allègements existants seront évalués, ni étendus ni supprimés." }
  - { <<: *d, question_id: eco-4, position: -2, status: confirmed, quote: "Aucune règle budgétaire automatique ne sera inscrite dans la loi." }

  - { <<: *d, question_id: pa-1, position: 2, status: confirmed, quote: "Le salaire minimum sera porté à un niveau supérieur dès la première année." }
  - { <<: *d, question_id: pa-2, position: -1, status: confirmed, quote: "Nous ne conditionnerons pas le revenu de solidarité à une activité obligatoire." }
  - { <<: *d, question_id: pa-3, position: -2, status: confirmed, quote: "Nous abrogerons le report de l'âge légal." }
  - { <<: *d, question_id: pa-4, position: 2, status: confirmed, quote: "L'encadrement des loyers sera généralisé à toutes les zones tendues puis étendu." }

  - { <<: *d, question_id: env-1, position: 1, status: confirmed, quote: "La construction de nouveaux réacteurs sera poursuivie, à un rythme maîtrisé." }
  - { <<: *d, question_id: env-2, position: 1, status: confirmed, quote: "Nous soutiendrons le développement de l'éolien terrestre concerté avec les communes." }
  - { <<: *d, question_id: env-3, position: 1, status: confirmed, quote: "Nous maintiendrons l'échéance de 2035 en accompagnant les ménages." }
  - { <<: *d, question_id: env-4, position: 2, status: confirmed, quote: "Nous défendrons un mécanisme d'ajustement carbone aux frontières." }

  - { <<: *d, question_id: sec-1, position: 1, status: confirmed, quote: "Les effectifs de police de proximité seront renforcés." }
  - { <<: *d, question_id: sec-2, position: -1, status: confirmed, quote: "Nous préférons l'individualisation des peines à des planchers automatiques." }
  - { <<: *d, question_id: sec-3, position: -2, status: confirmed, quote: "Nous mettrons fin à l'expérimentation de la vidéosurveillance algorithmique." }
  - { <<: *d, question_id: sec-4, position: 1, status: confirmed, quote: "Nous ouvrirons la voie à un cadre légal de vente encadrée." }

  - { <<: *d, question_id: imm-1, position: -1, status: confirmed, quote: "Nous ne durcirons pas les conditions générales de délivrance des titres." }
  - { <<: *d, question_id: imm-2, position: -2, status: confirmed, quote: "Aucune prestation ne sera conditionnée à une durée de résidence." }
  - { <<: *d, question_id: imm-3, position: 2, status: confirmed, quote: "Le parc d'hébergement pour demandeurs d'asile sera augmenté." }
  - { <<: *d, question_id: imm-4, position: 2, status: confirmed, quote: "L'accès au travail sera ouvert dès le dépôt de la demande d'asile." }

  - { <<: *d, question_id: eur-1, position: 1, status: confirmed, quote: "Nous soutenons de nouvelles compétences européennes en matière sociale." }
  - { <<: *d, question_id: eur-2, position: 1, status: confirmed, quote: "L'effort de défense sera poursuivi à son rythme actuel." }
  - { <<: *d, question_id: eur-3, position: 2, status: confirmed, quote: "Aucun accord commercial ne sera ratifié sans clause environnementale contraignante." }
  - { <<: *d, question_id: eur-4, position: -1, status: confirmed, quote: "Nous privilégions le renforcement des frontières extérieures à des contrôles intérieurs permanents." }

  - { <<: *d, question_id: san-1, position: 2, status: confirmed, quote: "Le budget de l'hôpital public sera augmenté chaque année du quinquennat." }
  - { <<: *d, question_id: san-2, position: 1, status: confirmed, quote: "Un conventionnement sélectif sera instauré dans les zones les mieux pourvues." }
  - { <<: *d, question_id: san-3, position: 2, status: confirmed, quote: "Nous augmenterons la part remboursée par l'assurance maladie." }
  - { <<: *d, question_id: san-4, position: -2, status: confirmed, quote: "Aucun nouveau service public ne sera confié à une gestion privée." }

  - { <<: *d, question_id: edu-1, position: 2, status: confirmed, quote: "La rémunération des enseignants sera revalorisée dès la rentrée." }
